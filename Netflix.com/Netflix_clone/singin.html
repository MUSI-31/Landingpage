<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="icon" href="img/icon2.webp">
    <link rel="stylesheet" href="sign.css">
</head>
<body>
    <header>
        <nav>
            <img src="img/logo.png" alt="img" class="logo">
        </nav>
        <form id="regform">
            <h1>Sign In</h1>
            <input type="email" class="email" placeholder="Email or mobile number" id="email">
            <p id="emailerror" class="error"></p>
            <br>
            <input type="password" class="password" placeholder="password" id="password">
            <p id="passerror" class="error"></p>
            <br>
            <button class="btn1" type="submit" id="signInBtn">Sign In</button>
            <br>
            <P class="para1">OR</P>
            <button class="btn2">Use a sign-in code</button><br>
            <a href="#" class="forget">Forgot Password?</a><br>
            <input type="checkbox" class="checkbox">
            <p class="para2">Remember Me</p>
            <p class="para3">New to Netflix? <a href="index.html" class="sig">Sign up now.</a></p>
            <p class="para4">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
            <a href="#" class="learn">Learn more.</a>
        </form>
    </header>
    <script src="sign.js"></script>
</body>
</html>
